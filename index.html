    <label class="f">통화하기 편한 시간<select id="call">${['언제든 괜찮아요', '오전', '점심시간 (12~1시)', '오후', '저녁 6시 이후'].map(o => `<option ${a.callTime === o ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
    <label class="f">요청사항<textarea rows="3" id="req" placeholder="예) 침실 간접조명 추가 상담 원해요">${esc(a.request)}</textarea></label></div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <label class="chk"><input type="checkbox" id="c1" ${a.c1 ? 'checked' : ''}><span><b>[필수]</b> 시공 일정 안내와 A/S를 위한 개인정보 수집·이용에 동의합니다.</span></label>
    <label class="chk"><input type="checkbox" id="c2" ${a.c2 ? 'checked' : ''}><span><b>[필수]</b> 계약 금액 및 시공 조건은 각 세대의 상담 내용과 현장 상황을 기준으로 확정됩니다. <b>다른 세대의 계약 조건이 동일하게 적용되는 것은 아님</b>을 확인했습니다.</span></label>
    <label class="chk"><input type="checkbox" id="c3" ${a.c3 ? 'checked' : ''}><span><b>[필수]</b> 도면 화면에서 고른 색온도(기본 전주백색 3500K)와 <b>패키지 기본 배치</b>로 시공하는 데 동의합니다. 배치 변경은 시공일 7일 전까지 담당자에게 전화로만 요청할 수 있어요.</span></label>
    <label class="chk"><input type="checkbox" id="c4" ${a.c4 ? 'checked' : ''}><span><b>[필수]</b> 시공일은 가능한 회차 안에서 저희가 배정해 문자로 안내하며, 잔금일을 <b>${esc(S.cfg.lastDate || '12/19')}까지 알려주지 않으면 1월 회차로 자동 배정</b>되는 데 동의합니다.</span></label></div>
  <div class="err hide" id="serr"></div>
  <button class="btn" id="submit">제출하기</button>`;
  const keep = () => { a.present = $('#present').value; a.callTime = $('#call').value; a.request = $('#req').value; const t = $('#nonetxt'); if (t) a.noneReason = t.value; ['c1', 'c2', 'c3', 'c4'].forEach(k => a[k] = $('#' + k).checked); };
  v.querySelectorAll('[data-round]').forEach(b => b.onclick = () => { keep(); const nm = b.dataset.round; a.offRounds[nm] = !a.offRounds[nm]; render(); });
  $('#submit').onclick = async () => {
    keep();
    if (!(a.c1 && a.c2 && a.c3 && a.c4)) return showErr('[필수] 동의 항목 4개를 체크해 주세요.');
    a.okRounds = okR.filter(r => !a.offRounds[r.name]).map(r => r.name);
    $('#submit').disabled = true; $('#submit').textContent = '보내는 중…';
    const r = await save('제출');
    if (!r.ok) { $('#submit').disabled = false; $('#submit').textContent = '제출하기'; return showErr(r.error || '저장에 실패했어요. 다시 시도해 주세요.'); }
    S.prev = { ...a, step: '제출', at: r.at }; go('done');
  };
  function showErr(m) { $('#serr').textContent = m; $('#serr').classList.remove('hide'); }
}
/* ---------- 6. 완료 · 7. 조회 ---------- */
function renderDone(v, d) {
  head('제출 완료');
  v.innerHTML = `<div style="padding:40px 4px 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px"><div style="width:64px;height:64px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h1 style="margin:0">입력해 주셔서 감사합니다</h1><p class="lead">담당자가 내용을 확인한 뒤<br><b style="color:var(--ink)">확인이 끝나면 문자로</b> 알려드려요.<br>추가로 여쭤볼 게 있는 세대만 따로 전화드립니다.</p></div>
  <div class="card"><h2>다음 순서</h2>${['담당자 확인 (영업일 1~2일) → 확인 완료 문자', '확인이 더 필요한 경우에만 전화 (확인 후 안내 항목 · 계약 내용이 다른 경우)', '시공일 배정 문자 (회차 안에서 날짜·시간) · 어려우면 답장만', '시공 전날 전화 1통 (출입 방법 확인)', '시공 · 시공 잔금 결제'].map((t, i) => `<div class="row" style="justify-content:flex-start;gap:10px"><b style="color:var(--blue)">${i + 1}</b><span>${t}</span></div>`).join('')}</div>
  <div style="flex:1"></div><button class="btn sec" id="look">내 계약 다시 보기</button><div class="foot">같은 문자 링크로 언제든 다시 조회·수정할 수 있어요.<br>문의 · 카카오채널 '프로어앤코' · 010-2528-8821</div>`;
  $('#look').onclick = () => go('lookup');
}
function renderLookup(v, d) {
  head('내 계약 조회'); const p = S.prev || S.ans, fans = d.fans || [];
  const step = S.locked ? 3 : (p && p.step === '제출' ? 2 : 1);
  const tl = [['계약 · 계약금 결제', `${esc(d.contract_date || '')} · ${won(d.deposit)}`], ['시공 정보 입력', p && p.step === '제출' ? '사양 · 가능 날짜 제출 완료' : '아직 제출 전이에요'], ['담당자 확인', S.locked ? '확인 완료 · 수정 잠김' : '확인되면 문자로 알려드려요 · 필요한 경우만 전화'], ['시공일 배정 문자', '회차 안에서 날짜·시간 · 확정되면 여기 나와요'], ['시공', '전날 출입 확인 전화 1통'], ['시공 잔금 결제 · A/S 12개월', '']];
  const fanRows = fans.map((f, i) => { const x = (p.fans || [])[i]; if (!x) return ''; return `<div class="row"><span>${esc(x.loc || f.loc || '방')} · ${SIZES[x.size][0]} ${SIZES[x.size][1].split(' ')[0]}</span><span class="r">${bodyOf(x)[1]} / ${BLADE.find(b => b[0] === x.blade)[1]} · ${x.iot ? 'IoT LED 포함' : (x.ledInc || x.led === 'led' ? 'LED' : 'LED 없음')}</span></div>`; }).join('');
  const exRows = MENU.filter(m => (p.extras || {})[m.id]).map(m => `${m.name} ×${p.extras[m.id]}`).join(', ');
  v.innerHTML = `<div class="unit">${esc(d.unit)} · ${esc(d.type)}</div><h1 style="margin-top:4px">${esc(d.customer)} 고객님 계약</h1>
  <div class="card"><h2>진행 상황</h2><div class="tl">${tl.map(([t, s], i) => `<div class="${i < step ? 'done' : i === step ? 'now' : ''}"><i>${i < step ? '✓' : i === step ? '●' : ''}</i><span><b style="${i > step ? 'color:var(--mut)' : ''}">${t}</b><small>${s}</small></span></div>`).join('')}</div></div>
  <div class="card"><h2>내가 고른 것 ${S.locked ? '<small>확정 · 수정 잠김</small>' : '<small><a href="#" id="edit" style="color:var(--blue)">수정하기</a></small>'}</h2>
    <div class="row"><span style="color:var(--mut)">색온도</span><span>${CCT.find(c => c[0] === (p.cct || '3500'))[1]} ${p.cct || 3500}K ${p.cctMode === 'B' ? '(공간별)' : ''}</span></div>
    ${fanRows}<div class="row"><span style="color:var(--mut)">실링팬 선택 추가금</span><span>${won(p.fanExtra)}</span></div>
    <div class="row"><span style="color:var(--mut)">아파트 잔금 · 이사</span><span>${p.balKnown && p.balDate ? fmtDate(p.balDate) : '미정'} · ${p.moveKnown && p.moveDate ? fmtDate(p.moveDate) : '미정'}</span></div>
    <div class="row"><span style="color:var(--mut)">추가 시공 요청</span><span class="r">${exRows || '없음'}${exRows ? ' (확인 중)' : ''}</span></div>
    <div class="row"><span style="color:var(--mut)">가능한 회차</span><span class="r">${(p.okRounds || []).join(' · ') || '전화 조율'}</span></div>
    <div class="hint">${S.locked ? '담당자 확인이 끝나 수정이 잠겼어요. 바꾸실 내용은 담당자에게 전화 주세요.' : '담당자 확인이 끝나면 수정이 잠겨요. 그 뒤 변경은 전화로만 돼요.'}</div></div>
  <div class="card"><h2>계약 내용</h2><div class="row"><span style="color:var(--mut)">시공 내용</span><span class="r">${(d.packages || []).map(x => esc(x.name || x.raw)).join(' · ')}</span></div><div class="row"><span style="color:var(--mut)">시공 잔금 (시공 후)</span><span>${won(d.balance)}</span></div><button class="btn sec" id="doc" style="height:46px;font-size:14px">계약서 원본 보기</button></div>
  <div class="foot">문의 · 카카오채널 '프로어앤코' · 010-2528-8821</div>`;
  $('#doc').onclick = () => openDoc(d); const e = $('#edit'); if (e) e.onclick = ev => { ev.preventDefault(); S.ans = Object.assign(defaultAns(d), p, { step: '임시' }); go('contract'); };
}
/* ---------- 저장 ---------- */
async function save(step) { S.ans.step = step; try { return await api({}, { action: 'save', code: S.code, last4: S.last4, payload: S.ans }); } catch (e) { return { ok: false, error: '연결이 원활하지 않아요.' }; } }
let draftT = null; function saveDraft() { clearTimeout(draftT); draftT = setTimeout(() => save('임시'), 400); }
render();
</script>
</body>
</html>
